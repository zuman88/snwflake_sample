name: Deploy PBIP to Fabric

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ✅ STEP 1: Deploy to DEV automatically
  deploy-dev:
    runs-on: windows-latest

    environment: dev  # optional, no approval needed here

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.Conn_SnwFlakeTest }}
          allow-no-subscriptions: true

      - name: Deploy to Dev Workspace
        shell: pwsh
        run: |
          pip install fabric-cicd
          python -u deploy.py --spn-auth --workspace_name "fabrictestws" --environment "dev"

  # ✅ STEP 2: Deploy to PROD (requires approval)
  deploy-prod:
    needs: deploy-dev   # 👈 ensures DEV runs first
    runs-on: windows-latest

    environment: prod   # 👈 THIS triggers approval

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.Conn_SnwFlakeTest }}
          allow-no-subscriptions: true

      - name: Deploy to Prod Workspace
        shell: pwsh
        run: |
          pip install fabric-cicd
          python -u deploy.py --spn-auth --workspace_name "fabricprodws" --environment "prod"
